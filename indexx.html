<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Visor dividido</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/leaflet.css">
  <link rel="stylesheet" href="css/qgis2web.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Cargar librerías -->
  <script src="js/leaflet.js"></script>
  <script src="js/qgis2web_expressions.js"></script>

  <!-- Cargar las dos partes divididas -->
  <script src="data/parcelatargz_part1.js"></script>
  <script src="data/parcelatargz_part2.js"></script>

  <script>
    // Unir las features de ambas partes
    var json_030_parcelatargzcopiar_0 = {
      "type": "FeatureCollection",
      "features": []
    };

    if (typeof json_parcelatargz_part1 !== 'undefined') {
      json_030_parcelatargzcopiar_0.features = json_030_parcelatargzcopiar_0.features.concat(json_parcelatargz_part1.features);
    }
    if (typeof json_parcelatargz_part2 !== 'undefined') {
      json_030_parcelatargzcopiar_0.features = json_030_parcelatargzcopiar_0.features.concat(json_parcelatargz_part2.features);
    }

    // Iniciar mapa
    var map = L.map('map').setView([-34.85, -58.45], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Agregar capa GeoJSON unida
    var layer = L.geoJSON(json_030_parcelatargzcopiar_0, {
      onEachFeature: function (feature, layer) {
        var popupContent = "";
        if (feature.properties) {
          for (var key in feature.properties) {
            popupContent += "<b>" + key + "</b>: " + feature.properties[key] + "<br>";
          }
        }
        layer.bindPopup(popupContent);
      }
    }).addTo(map);

    map.fitBounds(layer.getBounds());
  </script>
</body>
</html>
